<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Simple CRM{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="app-title">
            <a href="{{ url_for('index') }}">Justin Clay Simple CRM</a>
        </div>
        <div class="nav-links"> {# NEW WRAPPER FOR LINKS #}
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('create_customer') }}">Add New Customer</a>
            </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer>
        <p>&copy; {{ current_year }} Justin Clay CRM</p>
    </footer>
</body>
</html>
